name: madeenas_stock
description: Madeenas Stock — Mobile companion app for textile inventory management

publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.3.0

  # Navigation
  go_router: ^13.2.0

  # State management
  flutter_riverpod: ^2.5.1

  # Barcode scanning
  mobile_scanner: ^4.0.0

  # Offline SQLite queue
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Push notifications
  firebase_core: ^2.31.0
  firebase_messaging: ^14.9.0

  # PDF viewer
  flutter_pdfview: ^1.3.2

  # Utilities
  intl: ^0.19.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  package_info_plus: ^8.0.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  drift_dev: ^2.18.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
